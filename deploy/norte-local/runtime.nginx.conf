# First-party clients use scoped device Bearer tokens; browser management uses Spring session gateway.
location = /runtime/mcp {
    proxy_pass http://runtime:4317/mcp;
    proxy_set_header Host runtime;
    proxy_set_header Authorization $http_authorization;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 300s;
}
location ^~ /runtime/api/ {
    proxy_pass http://runtime:4317/api/;
    proxy_set_header Host runtime;
    proxy_set_header Authorization $http_authorization;
}
# Only explicitly exported Git snapshots are available here, on the loopback-only local deployment.
location ^~ /runtime/git/ {
    proxy_pass http://runtime:4317/git/;
    proxy_set_header Host runtime;
    proxy_http_version 1.1;
    proxy_request_buffering off;
}
